name: CI

on:
  pull_request:
    branches: [dev, main]
    # ready_for_review is not a default type: without it, marking a draft ready would not start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  # Pushes to main are not built: the pull request into main already built the same tree.
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether the three jobs below run. They are skipped for drafts and for changes that only touch
  # documentation or agent configuration. A job skipped by its `if` reports Success, so required checks still pass.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the commits pushed since the previous head are looked at, and only when that head's jobs passed
      # (or were skipped; on a push that includes iOS release link). Otherwise a docs-only commit after a broken one would show green on broken code.
      # A new, reopened or ready-for-review pull request always runs.
      - id: code
        name: Detect code changes
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          if [ "$EVENT" = push ] || [ "$ACTION" = synchronize ]; then
            code=$(scripts/ci/changed-code.sh "$BEFORE" "$HEAD_SHA")
            code=${code#code=}
            if [ "$code" = false ]; then
              green=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?per_page=100" 2>/dev/null \
                | scripts/ci/previous-head-green.sh "$EVENT" || echo false)
              echo "previous head $BEFORE green: $green"
              [ "$green" = true ] || code=true
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      - id: gate
        name: Decide
        env:
          CODE: ${{ steps.code.outputs.code }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$CODE" = true ] && [ "$DRAFT" != true ]; then run=true; else run=false; fi
          echo "run=$run (code=$CODE, draft=${DRAFT:-n/a})"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Lint, detekt and the JVM / Android host unit tests. Linux is enough: the Apple targets are skipped there
  # and covered by the ios-tests job.
  checks:
    name: Checks and unit tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      - name: Gradle build
        run: ./gradlew build --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      # Separate from the build, so a coverage drop is told apart from a failing test. Floors are in each module's
      # build file (`coverageFloor`); lowering one needs a reason in the pull request.
      - name: Coverage floors
        run: ./gradlew jacocoCoverageVerification --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Compiles the iOS targets and runs the commonTest / iosTest tests on the iOS simulator. These are plain
  # simulator tests (Compose UI tests included), not XCUITest end-to-end tests of the installed app.
  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      # Everything ./gradlew build runs for the Apple targets except the release frameworks: the simulator tests,
      # device compilation, the debug frameworks Xcode links, and the iOS / Apple / Native metadata compilation.
      # `checks` covers the rest, and `ios-release-link` links the release frameworks on pushes to dev.
      - name: iOS simulator tests, device compilation and frameworks
        run: >
          ./gradlew
          iosSimulatorArm64Test
          compileKotlinIosArm64
          compileTestKotlinIosArm64
          linkDebugFrameworkIosSimulatorArm64
          linkDebugFrameworkIosArm64
          compileIosMainKotlinMetadata
          compileAppleMainKotlinMetadata
          compileNativeMainKotlinMetadata
          metadataIosMainClasses
          metadataIosMainProcessResources
          iosArm64MetadataElements
          iosSimulatorArm64MetadataElements
          --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The release frameworks (`linkReleaseFramework…` for the simulator and the device). Kotlin/Native optimizes the
  # whole program for them on one thread, and the time swings from about 4 minutes to over 20 and sometimes past
  # 30 on the shared runner (thread dumps showed devirtualization, dead-code elimination and the LLVM passes, with
  # the daemon busy and memory free), so a pull request cannot wait on them. They run on pushes to dev, which the
  # pull request into main then ships, so the release link is still checked before anything reaches main.
  ios-release-link:
    name: iOS release link
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # Only restores: `ios-tests` saves this cache under the same key, and a second save would just warn.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      # Every 3 minutes the watchdog prints the busy Kotlin frames of the Gradle daemon's threads and keeps the full
      # jcmd dump under build/reports/tests/thread-dumps (uploaded on failure), so a slow link names the compiler
      # phase it is in. The step timeout fails a real stall with that output instead of cancelling the job blind.
      - name: Link the release frameworks
        timeout-minutes: 55
        run: |
          (while true; do
            sleep 180
            echo "::group::watchdog $(date -u +%T)"
            ps -axo pid,etime,%cpu,rss,command | sort -k4 -n -r | head -3 | cut -c1-200
            daemon=$(pgrep -f 'org.gradle.launcher.daemon.bootstrap.GradleDaemon' | head -1 || true)
            if [ -n "$daemon" ]; then
              mkdir -p build/reports/tests/thread-dumps
              dump="build/reports/tests/thread-dumps/daemon-$(date -u +%H%M%S).txt"
              "$JAVA_HOME/bin/jcmd" "$daemon" Thread.print > "$dump" 2>&1 || echo "jcmd failed for pid $daemon"
              awk 'BEGIN { RS = ""; ORS = "\n\n" } /RUNNABLE/ && /org\.jetbrains\.kotlin/' "$dump" \
                | cut -c1-180 | head -60
            else
              echo "no Gradle daemon found"
            fi
            echo "::endgroup::"
          done) &
          watchdog=$!
          trap 'kill "$watchdog" 2>/dev/null || true' EXIT
          ./gradlew \
          linkReleaseFrameworkIosSimulatorArm64 \
          linkReleaseFrameworkIosArm64 \
          --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Upload thread dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-link-dumps
          path: build/reports/tests/thread-dumps/
          retention-days: 7
          if-no-files-found: ignore

  # commonTest and androidDeviceTest on an emulator. The runner is small (2 cores, ~7 GB for a private repo), so
  # the test APKs are built first and the Gradle and Kotlin daemons are stopped before the emulator starts.
  android-device-tests:
    name: Android device tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The emulator refuses to start below a free-disk threshold, and building every module's test APKs first
      # takes more than the runner has left. Remove large toolchains this project doesn't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-google_apis-x86_64-pixel_6

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 600
          script: echo "Generated AVD snapshot for caching."

      - name: Build the test APKs
        run: ./gradlew packageAndroidDeviceTest --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Free memory for the emulator
        run: |
          ./gradlew --stop
          pkill -f org.jetbrains.kotlin.daemon.KotlinCompileDaemon || true
          free -m
          df -h /
          ps -eo pid,rss,args --sort=-rss | head -8 | cut -c1-160

      - name: Run instrumented tests
        # The tests take about 10 minutes. The timeout turns a stuck emulator shutdown into a quick failure.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/ci/run-device-tests.sh
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Memory diagnostics
        if: failure()
        run: |
          free -m || true
          df -h / || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            build/ci-logs/
          retention-days: 7
          if-no-files-found: ignore
