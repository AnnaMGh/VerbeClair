name: CI

on:
  pull_request:
    branches: [dev, main]
    # ready_for_review is not a default type: without it, marking a draft ready would not start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  workflow_dispatch:

# The event name keeps a manual run apart from a push run of the same branch. A newer run cancels the older one of the
# same pull request or of a push to dev. Runs for main and manual runs are not cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

permissions:
  contents: read

jobs:
  # Decides which of the check jobs below run (Notion N-18). The fast checks (checks and unit tests, iOS simulator
  # tests) run for pull requests into dev or main and for pushes to dev. The heavy checks (Android release build, Android
  # device tests, iOS frameworks) run for pull requests into main and pushes to main, and a push to main also runs the
  # iOS simulator tests. A manual run runs everything. Drafts run nothing, and so can documentation or agent
  # configuration changes to dev. A job skipped by its `if` reports Success, so required checks still pass.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      checks: ${{ steps.jobs.outputs.checks }}
      ios: ${{ steps.jobs.outputs.ios }}
      heavy: ${{ steps.jobs.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the commits pushed since the previous head are looked at, and only when that head's fast checks passed
      # (or were skipped). Otherwise a docs-only commit after a broken one would show green on broken code. A new,
      # reopened or ready-for-review pull request has no previous head, so it counts as code. decide-jobs.sh ignores
      # this result for anything about main.
      - id: code
        name: Detect code changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          green=false
          if [ "$EVENT" = push ] || [ "$ACTION" = synchronize ]; then
            code=$(scripts/ci/changed-code.sh "$BEFORE" "$HEAD_SHA")
            code=${code#code=}
            if [ "$code" = false ]; then
              # A failed API call leaves the script to read what there is, and it prints false for anything it can't
              # read. A fallback echo here would print a second value under pipefail and break GITHUB_OUTPUT.
              green=$({ gh api "repos/$REPO/commits/$BEFORE/check-runs?per_page=100" 2>/dev/null || true; } \
                | scripts/ci/previous-head-green.sh)
              echo "previous head $BEFORE green: $green"
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "green=$green" >> "$GITHUB_OUTPUT"

      # shell: bash turns on pipefail. Without it a failing script would be hidden by tee: this job would pass with empty
      # outputs, and every check job would be skipped, which counts as passing.
      - id: jobs
        name: Decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CODE: ${{ steps.code.outputs.code }}
          GREEN: ${{ steps.code.outputs.green }}
        run: |
          echo "event=$EVENT action=${ACTION:-n/a} target=$TARGET draft=${DRAFT:-n/a} code=$CODE green=$GREEN"
          scripts/ci/decide-jobs.sh "$EVENT" "$ACTION" "$TARGET" "$DRAFT" "$CODE" "$GREEN" | tee -a "$GITHUB_OUTPUT"

  # The Android debug build, app lint, the JVM / Android host unit tests, the static checks and compilation of the
  # instrumented tests, as the explicit tasks of scripts/ci/fast-tasks.txt. No release variant and no iOS compilation:
  # the macOS jobs cover iOS.
  checks:
    name: Checks and unit tests
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      - name: Build, unit tests and static checks
        shell: bash
        run: |
          tasks=$(scripts/ci/task-drift.sh --print)
          xargs ./gradlew --stacktrace <<< "$tasks"
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      # Separate from the build, so a coverage drop is told apart from a failing test. Floors are in each module's
      # build file (`coverageFloor`); lowering one needs a reason in the pull request.
      - name: Coverage floors
        run: ./gradlew jacocoCoverageVerification --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      # Fails when ./gradlew build has a check that the task list doesn't run. It only does dry runs; no job runs the
      # full build.
      - name: Task list drift guard
        run: scripts/ci/task-drift.sh
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      # Report only: there is no score floor, so surviving mutants never fail the job. Pitest itself failing does.
      - id: pitest
        name: Mutation testing
        run: ./gradlew :core:domain:pitest :core:database:pitest --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      # Both steps below also run when Pitest failed, to show whatever it wrote.
      - name: Mutation score
        if: ${{ !cancelled() && steps.pitest.outcome != 'skipped' }}
        shell: bash
        run: scripts/ci/pitest-summary.sh core/domain core/database | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: ${{ !cancelled() && steps.pitest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-reports
          path: |
            core/domain/build/reports/pitest/
            core/database/build/reports/pitest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Runs the commonTest / iosTest tests on the iOS simulator, as a debug test build. These are plain simulator tests
  # (Compose UI tests included), not XCUITest end-to-end tests of the installed app. Device compilation and the
  # frameworks are in the ios-frameworks job.
  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      # The Gradle and Kotlin daemon limits in gradle.properties may add up to more than the runner has.
      - name: Runner memory
        run: |
          sysctl -n hw.memsize hw.ncpu
          vm_stat

      - id: konan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      # Fetches the Kotlin/Native compiler and its dependencies (LLVM, libffi) by themselves, so that they can be
      # saved before the tests: a test run that fails or times out would otherwise leave no cache. The save is skipped
      # when this step fails, so an incomplete download is never saved.
      - name: Fetch the Kotlin/Native toolchain
        run: ./gradlew :core:domain:downloadKotlinNativeDistribution --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Save the Kotlin/Native toolchain
        if: steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Memory after the tests
        if: always()
        run: vm_stat

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The release variant of the app, with detekt's type-resolved analysis of it. The debug half is in checks.
  android-release-build:
    name: Android release build
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Release build and detekt
        run: ./gradlew :androidApp:assembleRelease :androidApp:detektRelease --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

  # The debug and release frameworks for the iOS simulator and the iOS device, which also compiles the production code
  # for devices. CI doesn't build the Xcode app. It only restores caches: ios-tests is the job that saves the toolchain.
  ios-frameworks:
    name: iOS frameworks
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Link the iOS frameworks
        run: >
          ./gradlew
          linkDebugFrameworkIosSimulatorArm64
          linkDebugFrameworkIosArm64
          linkReleaseFrameworkIosSimulatorArm64
          linkReleaseFrameworkIosArm64
          --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

  # commonTest and androidDeviceTest on an emulator. Gradle and the emulator compete for the runner's memory, so the
  # test APKs are built first and the Gradle and Kotlin daemons are stopped before the emulator starts.
  android-device-tests:
    name: Android device tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The emulator refuses to start below a free-disk threshold, and building every module's test APKs first
      # takes more than the runner has left. Remove large toolchains this project doesn't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Pull requests write their own cache too: GitHub scopes it to the PR, so dev and main never read it.
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-google_apis-x86_64-pixel_6

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 600
          script: echo "Generated AVD snapshot for caching."

      - name: Build the test APKs
        run: ./gradlew packageAndroidDeviceTest --stacktrace
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Free memory for the emulator
        run: |
          ./gradlew --stop
          pkill -f org.jetbrains.kotlin.daemon.KotlinCompileDaemon || true
          free -m
          df -h /
          ps -eo pid,rss,args --sort=-rss | head -8 | cut -c1-160

      - name: Run instrumented tests
        # The tests take about 10 minutes. The timeout turns a stuck emulator shutdown into a quick failure.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/ci/run-device-tests.sh
        env:
          FRENCH_VERBS_DATASET_TOKEN: ${{ secrets.FRENCH_VERBS_DATASET_TOKEN }}

      - name: Memory diagnostics
        if: failure()
        run: |
          free -m || true
          df -h / || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            build/ci-logs/
          retention-days: 7
          if-no-files-found: ignore
